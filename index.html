    <title>Mirakshi Botanicals | Mira Herbal Hair Oil</title>
    <script>
      // Gracefully silence Vite dev HMR websocket reconnection errors in cloud preview environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') || 
          String(event.reason.message || '').includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (
          String(event.message || '').includes('WebSocket') ||
          String(event.error || '').includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
    <meta name="description" content="Discover Mira Herbal Hair Oil by Mirakshi Botanicals, a natural-focused hair-care oil traditionally prepared for everyday scalp and hair care." />
